[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sre-trust-lab-backend"
version = "0.1.1"
description = "Backend foundation for the Agentic SRE Trust Lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pip-tools==7.6.1",
    "ruff==0.16.9",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
