name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Lint
        run: python -m ruff check app tests
      - name: Cluster manager lint
        run: python -m ruff check --config=../ruff.toml ../scripts/cluster.py
      - name: Telemetry script lint
        run: python -m ruff check --config=../ruff.toml ../scripts/telemetry.py
      - name: Evidence script lint
        run: python -m ruff check --config=../ruff.toml ../scripts/evidence.py
      - name: Eval script lint
        run: python -m ruff check --config=../ruff.toml ../scripts/eval.py
      - name: Typecheck
        run: python -m mypy app tests
      - name: Cluster manager typecheck
        run: python -m mypy --config-file pyproject.toml ../scripts/cluster.py
      - name: Telemetry script typecheck
        run: python -m mypy --config-file pyproject.toml ../scripts/telemetry.py
      - name: Evidence script typecheck
        run: python -m mypy --config-file pyproject.toml ../scripts/evidence.py
      - name: Eval script typecheck
        run: python -m mypy --config-file pyproject.toml ../scripts/eval.py
      - name: Sim script lint
        run: python -m ruff check --config=../ruff.toml ../scripts/sim.py
      - name: Sim script typecheck
        run: python -m mypy --config-file pyproject.toml ../scripts/sim.py
      - name: Lite CLI lint
        run: python -m ruff check --config=../ruff.toml ../scripts/lite.py
      - name: Lite CLI typecheck
        run: python -m mypy --config-file pyproject.toml ../scripts/lite.py
      - name: LLM smoke script lint
        run: python -m ruff check --config=../ruff.toml ../scripts/llm_smoke.py
      - name: LLM smoke script typecheck
        run: python -m mypy --config-file pyproject.toml ../scripts/llm_smoke.py
      - name: Domain schema tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Frontend API types are generated from OpenAPI
        run: python ../scripts/generate_api_types.py --check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Component tests
        run: npm run test
      - name: Build
        run: npm run build

  browser:
    name: Browser smoke and accessibility checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked browser-test dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock
      - name: Lint browser suite
        run: |
          python -m ruff check frontend/tests/browser
          python -m mypy --strict frontend/tests/browser/console_smoke.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck and lint
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser smoke suite
        run: >-
          python .agents/skills/webapp-testing/scripts/with_server.py
          --server "python -m uvicorn app.demo_main:app --app-dir backend --host 127.0.0.1 --port 8000"
          --port 8000
          --server "npm --prefix frontend run dev -- --host 127.0.0.1 --port 5173"
          --port 5173
          -- python frontend/tests/browser/console_smoke.py

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check placeholder and ignored files
        run: python scripts/check_hygiene.py
      - name: Check whitespace
        run: git diff --check

  evals:
    name: Safety evaluations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Lint eval package and tests
        run: python -m ruff check app/evals tests
      - name: Typecheck eval package and tests
        run: python -m mypy app/evals tests
      - name: Lint eval CLI
        run: python -m ruff check --config=../ruff.toml ../scripts/eval.py
      - name: Typecheck eval CLI
        run: python -m mypy --config-file pyproject.toml ../scripts/eval.py
      - name: Run deterministic fixtures
        run: python ../scripts/eval.py run --repeats 3 --out ../reports/raw
      - name: Grade and enforce safety invariants
        run: python ../scripts/eval.py report --raw ../reports/raw --out ../reports/latest
      - name: Upload raw results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faultweld-safety-evals-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
